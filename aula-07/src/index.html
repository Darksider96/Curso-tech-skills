<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Países do Mundo</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #363636;
            background-image: src('https://www.transparenttextures.com/patterns/white-paper-fibers.png');
        }
    </style>
</head>
<body class="p-4 sm:p-8">
    <div class="max-w-4xl mx-auto bg-white shadow-xl rounded-2xl p-6 sm:p-8">
        <h1 class="text-3xl sm:text-4xl font-bold text-center mb-6 text-gray-800">Países do Mundo</h1>
        
        <!-- Formulário de Filtro -->
        <div class="flex flex-col sm:flex-row gap-4 mb-6">
            <input 
                type="text" 
                id="country-name-input" 
                placeholder="Buscar por nome do país..." 
                class="w-full sm:w-2/3 p-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all duration-200"
            >
            <select 
                id="region-select" 
                class="w-full sm:w-1/3 p-3 border border-gray-300 rounded-xl bg-white text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all duration-200"
            >
                <option value="">Filtrar por Região</option>
                <option value="Africa">África</option>
                <option value="Americas">Américas</option>
                <option value="Asia">Ásia</option>
                <option value="Europe">Europa</option>
                <option value="Oceania">Oceania</option>
            </select>
        </div>

        <!-- Seção de Carregamento e Erro -->
        <div id="loading-message" class="text-center text-gray-500 italic hidden">
            Carregando países...
        </div>
        <div id="error-message" class="text-center text-red-500 font-medium hidden">
            Ocorreu um erro ao carregar os dados. Verifique o servidor e tente novamente.
        </div>
        
        <!-- Lista de Países -->
        <div id="countries-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Países serão renderizados aqui pelo JavaScript -->
        </div>

    </div>

    <script>
        // O endereço da sua API local.
        const API_URL = 'http://localhost:3004/countries';

        // Mapeia os elementos do DOM
        const countriesContainer = document.getElementById('countries-container');
        const nameInput = document.getElementById('country-name-input');
        const regionSelect = document.getElementById('region-select');
        const loadingMessage = document.getElementById('loading-message');
        const errorMessage = document.getElementById('error-message');

        /**
         * Realiza a chamada para a sua API local.
         * @param {string} name - Nome do país para busca.
         * @param {string} region - Região para filtro.
         */
        async function fetchCountries(name = '', region = '') {
            // Mostra a mensagem de carregamento e esconde a de erro
            loadingMessage.classList.remove('hidden');
            errorMessage.classList.add('hidden');
            countriesContainer.innerHTML = ''; // Limpa a lista anterior

            try {
                // Constrói a URL com os parâmetros de busca
                const url = new URL(API_URL);
                if (name) {
                    url.searchParams.append('name', name);
                }
                if (region) {
                    url.searchParams.append('region', region);
                }

                // Faz a requisição à API
                const response = await fetch(url);

                // Verifica se a resposta foi bem-sucedida
                if (!response.ok) {
                    throw new Error(`Erro na requisição: ${response.statusText}`);
                }

                const countries = await response.json();
                renderCountries(countries);

            } catch (error) {
                console.error('Falha ao buscar os países:', error);
                errorMessage.classList.remove('hidden');
                countriesContainer.innerHTML = '';
            } finally {
                loadingMessage.classList.add('hidden');
            }
        }

        /**
         * Renderiza a lista de países no DOM.
         * @param {Array<Object>} countries - Array de objetos de países.
         */
        function renderCountries(countries) {
            countriesContainer.innerHTML = '';
            if (countries.length === 0) {
                countriesContainer.innerHTML = '<p class="text-center text-gray-500">Nenhum país encontrado.</p>';
                return;
            }
            countries.forEach(country => {
                // Cria um elemento card para cada país, incluindo a bandeira e detalhes adicionais
                const card = document.createElement('div');
                card.className = 'bg-gray-100 p-6 rounded-2xl shadow-md transform hover:scale-105 transition-transform duration-200 flex flex-col items-center text-center';
                
                 // Log para verificar a estrutura do objeto
                // Assumindo que a sua API devolva os dados no mesmo formato que a API pública 'restcountries'
                const flagUrl = country.flags ? country.flags.png : '';
                const altText = `Bandeira de ${country.name.common}`;

                card.innerHTML = `
                    <div class="mb-4">
                        ${flagUrl ? `<img src="${flagUrl}" alt="${altText}" class="w-24 h-16 rounded-lg shadow-md border border-gray-300">` : ''}
                    </div>
                    <h2 class="text-xl font-semibold mb-2 text-gray-800">${country.name.common}</h2>
                    <p class="text-gray-600 mb-1"><strong>Capital:</strong> ${country.capital ? country.capital[0] : 'N/A'}</p>
                    <p class="text-gray-600 mb-1"><strong>Região:</strong> ${country.region}</p>
                    <p class="text-gray-600 mb-1"><strong>População:</strong> ${country.population ? country.population.toLocaleString() : 'N/A'}</p>
                `;
                countriesContainer.appendChild(card);
            });
        }

        // Adiciona event listeners para os filtros
        let debounceTimer;
        nameInput.addEventListener('input', () => {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                const name = nameInput.value;
                const region = regionSelect.value;
                fetchCountries(name, region);
            }, 300); // 300ms de atraso para evitar múltiplas requisições
        });

        regionSelect.addEventListener('change', () => {
            const name = nameInput.value;
            const region = regionSelect.value;
            fetchCountries(name, region);
        });

        // Carrega os países ao iniciar a página
        fetchCountries();

    </script>
</body>
</html>
